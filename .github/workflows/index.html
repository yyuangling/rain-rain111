<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>高考AI复习 · 每日智能计划</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;--paper:#fff;--ink:#1c1917;--muted:#78716c;--border:#e7e5e0;--subtle:#f5f3ee;
  --cn:#b45309;--cn-bg:#fef3c7;
  --en:#0f766e;--en-bg:#ccfbf1;
  --ma:#1d4ed8;--ma-bg:#dbeafe;
  --po:#7c3aed;--po-bg:#ede9fe;
  --hi:#be185d;--hi-bg:#fce7f3;
  --ge:#0e7490;--ge-bg:#cffafe;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.7;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:210px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200;}
.logo{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.logo-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:900;letter-spacing:1px;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:2px;font-family:'JetBrains Mono',monospace;}
.sb-top{padding:14px 12px 10px;border-bottom:1px solid var(--border);}
.today-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:8px;
  border:none;background:var(--ink);color:#fff;font-family:'Noto Sans SC',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;}
.today-btn:hover{opacity:.85;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;
  box-shadow:0 0 5px #4ade80;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.hist-label{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;
  padding:12px 12px 6px;font-family:'JetBrains Mono',monospace;}
.hist-scroll{flex:1;overflow-y:auto;padding:0 12px 12px;}
.hist-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent;}
.hist-item:hover{background:var(--subtle);}
.hist-item.cur{background:var(--subtle);border-color:var(--border);}
.hist-date{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;}
.hist-day{font-size:11px;color:var(--muted);}
.hist-prog{margin-left:auto;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.hdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.hdot-today{background:#60a5fa;box-shadow:0 0 5px #60a5fa;}
.hdot-full{background:#4ade80;}
.hdot-part{background:#fbbf24;}
.hdot-none{background:var(--border);}
.sb-bottom{padding:12px;border-top:1px solid var(--border);}
.streak-box{text-align:center;background:var(--subtle);border-radius:8px;padding:10px;}
.streak-n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;line-height:1;}
.streak-l{font-size:10px;color:var(--muted);margin-top:2px;}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--paper);border-bottom:1px solid var(--border);padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tb-left{}
.tb-title-row{display:flex;align-items:center;gap:10px;}
.tb-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;}
.tb-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
.tag-today{background:#dcfce7;color:#166534;}
.tag-hist{background:#fef3c7;color:#92400e;}
.tb-date{font-size:12px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.tb-right{display:flex;align-items:center;gap:12px;}
.countdown{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  padding:5px 11px;background:var(--subtle);border-radius:6px;border:1px solid var(--border);}
.ctime{font-family:'JetBrains Mono',monospace;color:var(--ink);font-weight:500;}
.prog-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.prog-track{width:110px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cn),var(--en));transition:width .4s;}
.content{flex:1;padding:24px 32px 60px;max-width:980px;}
.day-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
  padding:16px 22px;background:var(--paper);border:1px solid var(--border);border-radius:12px;}
.dh-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:900;}
.dh-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.dh-stat{text-align:right;}
.dh-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;}
.dh-nlabel{font-size:11px;color:var(--muted);}
.dh-track{width:90px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;margin-left:auto;}
.dh-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cn),var(--en));transition:width .4s;}
.hist-notice{background:#fef3c7;border:1px solid #fde68a;border-radius:9px;padding:9px 15px;
  font-size:13px;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;margin-bottom:12px;}
.tc{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;
  overflow:hidden;transition:box-shadow .2s;}
.tc:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);}
.tc[data-s=cn]{border-left:4px solid var(--cn);}
.tc[data-s=en]{border-left:4px solid var(--en);}
.tc[data-s=ma]{border-left:4px solid var(--ma);}
.tc[data-s=po]{border-left:4px solid var(--po);}
.tc[data-s=hi]{border-left:4px solid var(--hi);}
.tc[data-s=ge]{border-left:4px solid var(--ge);}
.tc.done{opacity:.42;}
.tc.done .tc-title{text-decoration:line-through;}
.tc-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
.tc-chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--paper);
  transition:all .15s;cursor:pointer;position:relative;z-index:2;}
.tc.done .tc-chk{background:var(--muted);border-color:var(--muted);}
.tc-body-h{flex:1;}
.tc-title{font-size:13.5px;font-weight:500;}
.tc-hint{font-size:12px;color:var(--muted);margin-top:2px;}
.tc-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.spill{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500;}
.sp-cn{background:var(--cn-bg);color:var(--cn);}
.sp-en{background:var(--en-bg);color:var(--en);}
.sp-ma{background:var(--ma-bg);color:var(--ma);}
.sp-po{background:var(--po-bg);color:var(--po);}
.sp-hi{background:var(--hi-bg);color:var(--hi);}
.sp-ge{background:var(--ge-bg);color:var(--ge);}
.arr{font-size:11px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
.tc.open .arr{transform:rotate(90deg);}
.tc-content{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.tc.open .tc-content{max-height:3000px;}
.tc-inner{padding:0 18px 18px;border-top:1px dashed var(--border);padding-top:16px;}
.tip{font-size:12px;color:var(--muted);background:rgba(0,0,0,.03);border-radius:6px;
  padding:8px 11px;margin-top:6px;line-height:1.7;}
.ask-row{display:flex;gap:8px;margin-top:10px;}
.ask-inp{flex:1;background:var(--paper);border:1px solid var(--border);border-radius:7px;
  padding:8px 12px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;font-size:13px;outline:none;}
.ask-inp:focus{border-color:#aaa;}
.ask-btn{padding:8px 16px;border-radius:7px;border:none;font-family:'Noto Sans SC',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;color:#fff;white-space:nowrap;transition:opacity .15s;}
.ask-btn:hover{opacity:.82;}
.ask-ans{margin-top:10px;background:var(--subtle);border:1px solid var(--border);border-radius:8px;
  padding:13px 15px;font-size:13.5px;line-height:2;display:none;white-space:pre-wrap;}
.ask-ans.on{display:block;}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
.wcard{background:var(--paper);border:1.5px solid var(--border);border-radius:10px;
  padding:14px;transition:all .15s;}
.wcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.wi{font-size:20px;margin-bottom:5px;}
.wn{font-size:13px;font-weight:600;margin-bottom:2px;}
.wd{font-size:11.5px;color:var(--muted);}
.wb{margin-top:8px;font-size:10px;padding:2px 7px;border-radius:3px;display:inline-block;
  font-family:'JetBrains Mono',monospace;background:#fef3c7;color:#92400e;}
.sync-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-top:8px;}
.sync-card h3{font-size:15px;font-weight:600;margin-bottom:4px;}
.sync-card p{font-size:13px;color:var(--muted);margin-bottom:12px;}
.sync-ta{width:100%;background:var(--subtle);border:1px solid var(--border);border-radius:8px;
  padding:11px 13px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;
  font-size:13px;line-height:1.8;resize:vertical;min-height:78px;outline:none;}
.sync-ta:focus{border-color:#aaa;}
.sync-btn{margin-top:10px;padding:9px 22px;background:var(--ink);color:var(--paper);border:none;
  border-radius:7px;font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:opacity .15s;}
.sync-btn:hover{opacity:.82;}
.sync-btn:disabled{opacity:.4;cursor:not-allowed;}
.sync-res{margin-top:12px;background:var(--subtle);border:1px solid var(--border);border-radius:9px;
  padding:14px 16px;font-size:13.5px;line-height:2;display:none;white-space:pre-wrap;}
.sync-res.on{display:block;}
.sync-lbl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
.dots{display:inline-flex;gap:4px;align-items:center;}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s;}
.dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:1;}}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="logo">
    <div class="logo-title">高考AI复习</div>
    <div class="logo-sub">每日智能计划</div>
  </div>
  <div class="sb-top">
    <button class="today-btn" onclick="generateTodayPlan()">
      <span class="live-dot"></span>✨ 生成今日计划
    </button>
  </div>
  <div class="hist-label">历史记录</div>
  <div class="hist-scroll" id="histList"></div>
  <div class="sb-bottom">
    <div class="streak-box">
      <div class="streak-n" id="streakN">1</div>
      <div class="streak-l">连续学习天数 🔥</div>
    </div>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-title-row">
        <span class="tb-title" id="tbTitle">今日任务</span>
        <span class="tb-tag tag-today" id="tbTag">今天</span>
      </div>
      <div class="tb-date" id="tbDate"></div>
    </div>
    <div class="tb-right">
      <div class="countdown">高考倒计时 <span class="ctime" id="countdownDisplay"></span></div>
      <div class="prog-row">
        <span id="progTxt">0/10</span>
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        完成
      </div>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
</div>
</div>
<script>
const UPDATE_HOUR = 6;
const DAYS_CN = ['周日','周一','周二','周三','周四','周五','周六'];
const SUBJ_NAME = {cn:'语文',en:'英语',ma:'数学',po:'政治',hi:'历史',ge:'地理'};

// ======================= DeepSeek API 配置（已填入你的Key） =======================
const DEEPSEEK_API_KEY = 'sk-aa12d0bdd9ce452fa53009d71319c6dc';

// AI 系统提示词（生成每日计划）
const PLAN_SYSTEM_PROMPT = `你是高考备考AI规划师，负责为高三学生生成每日复习计划。
你需要生成10个任务，覆盖语文、数学、英语、政治、历史、地理六科。
每个任务包含：学科代码(cn/en/ma/po/hi/ge)、标题、提示语、具体学习内容（可以是题目、背诵任务、知识点总结等）。
任务应基于高考倒计时和学生的完成历史（如果有）来动态调整难度和重点。
输出格式必须是严格的 JSON 数组，每个元素如下：
{
  "subject": "cn",
  "title": "语文 · 古诗文鉴赏",
  "hint": "理解诗歌情感，分析手法",
  "content": "具体学习内容或题目（支持HTML简单格式）"
}
只输出数组，不要有其他文字。每天的任务应均衡各科，且包含真题练习、知识点复习、背诵等不同类型。`;

async function generatePlanFromAI(historySummary = "") {
  const today = new Date();
  const gaokaoDate = new Date(today.getFullYear(), 5, 7);
  if (today > gaokaoDate) gaokaoDate.setFullYear(today.getFullYear()+1);
  const daysLeft = Math.ceil((gaokaoDate - today) / (1000*60*60*24));
  const userPrompt = `今天是${today.getMonth()+1}月${today.getDate()}日，距离高考还有${daysLeft}天。${historySummary ? "已完成历史："+historySummary : "这是第一天复习。"}请生成今日10个任务的JSON数组。`;
  try {
    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + DEEPSEEK_API_KEY
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: PLAN_SYSTEM_PROMPT },
          { role: 'user', content: userPrompt }
        ],
        temperature: 0.8,
        max_tokens: 3000
      })
    });
    const data = await response.json();
    let content = data.choices[0].message.content;
    const jsonMatch = content.match(/\[[\s\S]*\]/);
    if (jsonMatch) content = jsonMatch[0];
    const tasks = JSON.parse(content);
    return tasks.map((t, idx) => ({
      id: idx+1,
      s: t.subject,
      title: t.title,
      hint: t.hint,
      type: 'ai_task',
      content: t.content,
      di: idx
    }));
  } catch(e) {
    console.error("AI生成失败", e);
    return getDefaultTasks();
  }
}

function getDefaultTasks() {
  return [
    {id:1,s:'cn',title:'语文 · 文言文阅读',hint:'翻译句子，概括主旨',type:'ai_task',content:'阅读《劝学》全文，翻译最后一段，并写出中心论点。'},
    {id:2,s:'ma',title:'数学 · 函数与导数',hint:'求单调区间和极值',type:'ai_task',content:'已知f(x)=x³-3x+1，求单调区间和极值。'},
    {id:3,s:'en',title:'英语 · 阅读理解',hint:'抓住主旨，猜词义',type:'ai_task',content:'做一篇关于环保的阅读理解（短文略），回答4个问题。'},
    {id:4,s:'po',title:'政治 · 经济生活',hint:'宏观调控手段',type:'ai_task',content:'简述财政政策和货币政策的区别，并举例说明。'},
    {id:5,s:'hi',title:'历史 · 近代史',hint:'背景、经过、影响',type:'ai_task',content:'简述辛亥革命的历史意义。'},
    {id:6,s:'ge',title:'地理 · 自然地理',hint:'分析成因',type:'ai_task',content:'分析长江三角洲的形成原因。'},
    {id:7,s:'cn',title:'语文 · 名句默写',hint:'易错字注意',type:'ai_task',content:'默写《登高》前四句。'},
    {id:8,s:'ma',title:'数学 · 解三角形',hint:'正弦余弦定理',type:'ai_task',content:'在△ABC中，a=7,b=8,cosC=13/14，求c。'},
    {id:9,s:'en',title:'英语 · 作文模板',hint:'应用文',type:'ai_task',content:'背诵建议信模板，并仿写一封建议信。'},
    {id:10,s:'ge',title:'地理 · 人文地理',hint:'区位因素',type:'ai_task',content:'分析上海宝山钢铁厂的区位优势。'},
  ];
}

function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function keyToDate(k) {
  const [y,m,d] = k.split('-');
  return new Date(+y, +m-1, +d);
}
function isToday(k) { return k === todayKey(); }
function loadStore() { return JSON.parse(localStorage.getItem('gk_ai') || '{}'); }
function saveStore(s) { localStorage.setItem('gk_ai', JSON.stringify(s)); }
function getDayData(k) {
  const s = loadStore();
  if (!s[k]) { s[k] = { tasks: null, done: [], sync: '', generated: false }; saveStore(s); }
  return s[k];
}
function setDone(k, id, v) {
  const s = loadStore();
  if (!s[k]) return;
  if (v && !s[k].done.includes(id)) s[k].done.push(id);
  if (!v) s[k].done = s[k].done.filter(x => x !== id);
  saveStore(s);
  renderDay(k);
}
function setSync(k, txt) {
  const s = loadStore(); if (!s[k]) return;
  s[k].sync = txt; saveStore(s);
}

async function generateTodayPlan() {
  const k = todayKey();
  const data = getDayData(k);
  const contentDiv = document.getElementById('mainContent');
  contentDiv.innerHTML = '<div class="sync-card"><div class="dots"><span></span><span></span><span></span></div> AI正在为你量身定制今日复习计划...</div>';
  const s = loadStore();
  let historySummary = "";
  const keys = Object.keys(s).sort().reverse().slice(0,5);
  for (let key of keys) {
    if (s[key].done && s[key].done.length > 0) {
      historySummary += `${key}: 完成了${s[key].done.length}/10个任务；`;
    }
  }
  try {
    const aiTasks = await generatePlanFromAI(historySummary);
    data.tasks = aiTasks;
    data.generated = true;
    saveStore(s);
    renderDay(k);
  } catch(e) {
    contentDiv.innerHTML = '<div class="sync-card"><p>❌ 生成失败，请检查网络或API Key。点击重试。</p><button onclick="generateTodayPlan()" class="sync-btn">重试</button></div>';
  }
}

function renderContent(task) {
  if (task.type === 'ai_task') {
    let contentHtml = `<div class="tbl" style="border-color:var(--${task.s})"><div class="tbt">📚 学习任务</div>${task.content}</div>`;
    contentHtml += `<div class="ask-row"><input class="ask-inp" id="ask-${task.id}" placeholder="有疑问？直接问AI…"/><button class="ask-btn" style="background:var(--${task.s})" onclick="taskAsk('${task.s}','ask-${task.id}','ans-${task.id}')">问AI→</button></div>
                    <div class="ask-ans" id="ans-${task.id}"></div>`;
    return contentHtml;
  }
  return '<div class="tip">暂无详细内容</div>';
}

function renderDay(k) {
  const data = getDayData(k);
  let tasks = data.tasks;
  if (!tasks || tasks.length === 0) {
    const isTod = isToday(k);
    document.getElementById('mainContent').innerHTML = `<div class="day-hdr"><div class="dh-left"><div class="dh-title">${isTod ? '今日无计划' : '无记录'}</div></div></div>
    <div class="sync-card"><p>🤖 还没有生成复习计划。点击左侧「生成今日计划」按钮，AI 将为你定制专属任务。</p>
    <button class="sync-btn" onclick="generateTodayPlan()">生成今日计划</button></div>`;
    document.getElementById('progTxt').textContent = `0/0`;
    document.getElementById('progFill').style.width = '0%';
    renderSidebar();
    return;
  }
  const done = data.done || [];
  const tot = tasks.length;
  const comp = done.length;
  const pct = Math.round(comp/tot*100);
  const isTod = isToday(k);
  const dt = keyToDate(k);
  document.getElementById('tbTitle').textContent = isTod ? '今日任务' : `${dt.getMonth()+1}月${dt.getDate()}日的任务`;
  const tag = document.getElementById('tbTag');
  tag.textContent = isTod ? '今天' : '历史记录';
  tag.className = 'tb-tag ' + (isTod ? 'tag-today' : 'tag-hist');
  document.getElementById('tbDate').textContent = `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日 · ${DAYS_CN[dt.getDay()]}`;
  document.getElementById('progTxt').textContent = `${comp}/${tot}`;
  document.getElementById('progFill').style.width = pct + '%';
  let html = `<div class="day-hdr"><div class="dh-left"><div class="dh-title">${dt.getMonth()+1}月${dt.getDate()}日 · ${DAYS_CN[dt.getDay()]}</div><div class="dh-sub">${isTod ? 'AI 生成今日计划' : '历史任务'}</div></div>
  <div class="dh-stat"><div class="dh-num">${comp}<span style="font-size:14px;color:var(--muted)">/${tot}</span></div><div class="dh-nlabel">任务完成</div><div class="dh-track"><div class="dh-fill" style="width:${pct}%"></div></div></div></div>`;
  if (!isTod) html += `<div class="hist-notice">📁 历史记录，可继续打卡。</div>`;
  html += `<div class="sec-label">今日AI任务 · 点击展开</div>`;
  tasks.forEach(task => {
    const isDone = done.includes(task.id);
    html += `<div class="tc${isDone?' done':''}" data-s="${task.s}" id="tc-${k}-${task.id}">
      <div class="tc-head" onclick="toggleCard('${k}',${task.id})">
        <div class="tc-chk" onclick="checkTask(event,'${k}',${task.id})">${isDone?'✓':''}</div>
        <div class="tc-body-h"><div class="tc-title">${task.title}</div><div class="tc-hint">${task.hint}</div></div>
        <div class="tc-meta"><span class="spill sp-${task.s}">${SUBJ_NAME[task.s]}</span><span class="arr">▶</span></div>
      </div>
      <div class="tc-content"><div class="tc-inner">${renderContent(task)}</div></div>
    </div>`;
  });
  html += `<div class="sync-card"><h3>📝 学习反馈与调整</h3><p>告诉AI你今天的学习情况，它会帮你优化明天的计划。</p>
    <textarea class="sync-ta" id="syncTA" placeholder="例如：今天数学函数题不太懂，文言文翻译有点难…"></textarea><br>
    <button class="sync-btn" onclick="doSync()">反馈给AI →</button>
    <div class="sync-res" id="syncRes"><div class="sync-lbl">AI 建议</div><div id="syncTxt"></div></div></div>`;
  document.getElementById('mainContent').innerHTML = html;
  renderSidebar();
}

function toggleCard(k, id) {
  const el = document.getElementById(`tc-${k}-${id}`);
  if (el) el.classList.toggle('open');
}
async function checkTask(e, k, id) {
  e.stopPropagation();
  const s = loadStore();
  const data = s[k];
  if (!data) return;
  const isDone = data.done.includes(id);
  setDone(k, id, !isDone);
  const card = document.getElementById(`tc-${k}-${id}`);
  if (card) {
    if (!isDone) card.classList.add('done'); else card.classList.remove('done');
    const chk = card.querySelector('.tc-chk');
    if (chk) chk.textContent = !isDone ? '✓' : '';
  }
  const newData = loadStore()[k];
  const comp = newData.done.length, tot = newData.tasks.length;
  document.getElementById('progTxt').textContent = `${comp}/${tot}`;
  document.getElementById('progFill').style.width = Math.round(comp/tot*100) + '%';
  const dhNum = document.querySelector('.dh-num');
  if (dhNum) dhNum.innerHTML = `${comp}<span style="font-size:14px;color:var(--muted)">/${tot}</span>`;
  const dhFill = document.querySelector('.dh-fill');
  if (dhFill) dhFill.style.width = Math.round(comp/tot*100) + '%';
  renderSidebar();
}

const AI_SYS = {
  cn:'你是高中语文老师', en:'高中英语老师', ma:'高中数学老师', po:'高中政治老师', hi:'高中历史老师', ge:'高中地理老师'
};
async function callAI(sys, q) {
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_API_KEY },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'system', content: sys }, { role: 'user', content: q }], max_tokens: 1000 })
    });
    const data = await res.json();
    return data.choices[0].message.content;
  } catch(e) { return '请求失败：' + e.message; }
}
function showLoading(boxId) {
  const box = document.getElementById(boxId);
  if (box) { box.classList.add('on'); box.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> 思考中…'; }
  return box;
}
async function taskAsk(s, inputId, ansId) {
  const inp = document.getElementById(inputId);
  const box = showLoading(ansId);
  if (!inp || !box) return;
  const q = inp.value.trim(); if (!q) { box.classList.remove('on'); return; }
  try { box.textContent = await callAI(AI_SYS[s], q); }
  catch { box.textContent = '网络失败'; }
}
async function doSync() {
  const ta = document.getElementById('syncTA');
  const btn = document.getElementById('syncBtn');
  const res = document.getElementById('syncRes');
  const txt = document.getElementById('syncTxt');
  if (!ta || !btn) return;
  const q = ta.value.trim(); if (!q) return;
  btn.disabled = true; btn.textContent = '分析中…';
  res.classList.add('on');
  txt.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> AI分析中…';
  const sys = `你是高考备考顾问，根据学生反馈优化第二天的计划。给出具体建议（2-3点）。`;
  try {
    const ans = await callAI(sys, '学生反馈：' + q);
    txt.textContent = ans;
    setSync(todayKey(), q);
  } catch { txt.textContent = '失败，请重试。'; }
  btn.disabled = false; btn.textContent = '反馈给AI →';
}

function renderSidebar() {
  const s = loadStore();
  const today = todayKey();
  const keys = Object.keys(s).sort().reverse().slice(0,30);
  let html = keys.map(k => {
    const d = keyToDate(k);
    const data = s[k];
    const done = data?.done?.length || 0;
    const tot = data?.tasks?.length || 10;
    const pct = done/tot;
    const dotCls = isToday(k) ? 'hdot-today' : pct===1 ? 'hdot-full' : pct>0 ? 'hdot-part' : 'hdot-none';
    return `<div class="hist-item" onclick="renderDay('${k}')"><div class="hdot ${dotCls}"></div><div><div class="hist-date">${d.getMonth()+1}/${d.getDate()}${isToday(k)?' · 今天':''}</div><div class="hist-day">${DAYS_CN[d.getDay()]}</div></div><div class="hist-prog">${done}/${tot}</div></div>`;
  }).join('');
  document.getElementById('histList').innerHTML = html || '<div style="padding:12px;color:var(--muted)">暂无历史</div>';
  const streak = Object.values(s).filter(v => v.done && v.done.length>0).length;
  document.getElementById('streakN').textContent = streak || 1;
}

function updateCountdown() {
  const now = new Date();
  const gaokao = new Date(now.getFullYear(), 5, 7);
  if (now > gaokao) gaokao.setFullYear(now.getFullYear()+1);
  const days = Math.ceil((gaokao - now) / (1000*60*60*24));
  document.getElementById('countdownDisplay').textContent = `${days}天`;
}
setInterval(updateCountdown, 1000);
updateCountdown();

window.onload = () => {
  const today = todayKey();
  const data = getDayData(today);
  if (!data.tasks || data.tasks.length === 0) {
    renderDay(today);
  } else {
    renderDay(today);
  }
};
</script>
