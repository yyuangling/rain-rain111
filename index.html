<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考一轮复习系统</title>
<style>
/* 使用系统字体，无需加载外部字体，墙内完全可用 */
</style>
<style>
:root{
  --bg:#f7f5f0;--paper:#fff;--ink:#1c1917;--muted:#78716c;--border:#e7e5e0;--subtle:#f5f3ee;
  --cn:#b45309;--cn-bg:#fef3c7;
  --en:#0f766e;--en-bg:#ccfbf1;
  --ma:#1d4ed8;--ma-bg:#dbeafe;
  --po:#7c3aed;--po-bg:#ede9fe;
  --hi:#be185d;--hi-bg:#fce7f3;
  --ge:#0e7490;--ge-bg:#cffafe;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.7;}
.layout{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:200;}
.logo{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.logo-title{font-family:'PingFang SC','Microsoft YaHei','STSong',serif;font-size:16px;font-weight:900;letter-spacing:1px;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:2px;font-family:'SF Mono','Courier New',monospace;}
.sb-top{padding:14px 12px 10px;border-bottom:1px solid var(--border);}
.today-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:8px;
  border:none;background:var(--ink);color:#fff;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;}
.today-btn:hover{opacity:.85;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;
  box-shadow:0 0 5px #4ade80;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.hist-label{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;
  padding:12px 12px 6px;font-family:'SF Mono','Courier New',monospace;}
.hist-scroll{flex:1;overflow-y:auto;padding:0 12px 12px;}
.hist-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent;}
.hist-item:hover{background:var(--subtle);}
.hist-item.cur{background:var(--subtle);border-color:var(--border);}
.hist-date{font-family:'SF Mono','Courier New',monospace;font-size:12px;font-weight:500;}
.hist-day{font-size:11px;color:var(--muted);}
.hist-prog{margin-left:auto;font-size:10px;color:var(--muted);font-family:'SF Mono','Courier New',monospace;}
.hdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.hdot-today{background:#60a5fa;box-shadow:0 0 5px #60a5fa;}
.hdot-full{background:#4ade80;}
.hdot-part{background:#fbbf24;}
.hdot-none{background:var(--border);}
.sb-bottom{padding:12px;border-top:1px solid var(--border);}
.streak-box{text-align:center;background:var(--subtle);border-radius:8px;padding:10px;}
.streak-n{font-family:'SF Mono','Courier New',monospace;font-size:26px;font-weight:600;line-height:1;}
.streak-l{font-size:10px;color:var(--muted);margin-top:2px;}

/* MAIN */
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--paper);border-bottom:1px solid var(--border);padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tb-left{}
.tb-title-row{display:flex;align-items:center;gap:10px;}
.tb-title{font-family:'PingFang SC','Microsoft YaHei','STSong',serif;font-size:16px;font-weight:700;}
.tb-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-family:'SF Mono','Courier New',monospace;}
.tag-today{background:#dcfce7;color:#166534;}
.tag-hist{background:#fef3c7;color:#92400e;}
.tb-date{font-size:12px;color:var(--muted);margin-top:2px;font-family:'SF Mono','Courier New',monospace;}
.tb-right{display:flex;align-items:center;gap:12px;}
.countdown{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  padding:5px 11px;background:var(--subtle);border-radius:6px;border:1px solid var(--border);}
.ctime{font-family:'SF Mono','Courier New',monospace;color:var(--ink);font-weight:500;}
.prog-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.prog-track{width:110px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cn),var(--en));transition:width .4s;}

/* CONTENT */
.content{flex:1;padding:24px 32px 60px;max-width:980px;}

/* DAY HEADER */
.day-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
  padding:16px 22px;background:var(--paper);border:1px solid var(--border);border-radius:12px;}
.dh-title{font-family:'PingFang SC','Microsoft YaHei','STSong',serif;font-size:20px;font-weight:900;}
.dh-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:'SF Mono','Courier New',monospace;}
.dh-stat{text-align:right;}
.dh-num{font-family:'SF Mono','Courier New',monospace;font-size:22px;font-weight:600;}
.dh-nlabel{font-size:11px;color:var(--muted);}
.dh-track{width:90px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;margin-left:auto;}
.dh-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cn),var(--en));transition:width .4s;}
.hist-notice{background:#fef3c7;border:1px solid #fde68a;border-radius:9px;padding:9px 15px;
  font-size:13px;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;
  font-family:'SF Mono','Courier New',monospace;margin-bottom:12px;}

/* TASK CARD */
.tc{background:var(--paper);border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;
  overflow:hidden;transition:box-shadow .2s;}
.tc:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);}
.tc[data-s=cn]{border-left:4px solid var(--cn);}
.tc[data-s=en]{border-left:4px solid var(--en);}
.tc[data-s=ma]{border-left:4px solid var(--ma);}
.tc[data-s=po]{border-left:4px solid var(--po);}
.tc[data-s=hi]{border-left:4px solid var(--hi);}
.tc[data-s=ge]{border-left:4px solid var(--ge);}
.tc.done{opacity:.42;}
.tc.done .tc-title{text-decoration:line-through;}
.tc-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
.tc-chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--paper);
  transition:all .15s;cursor:pointer;position:relative;z-index:2;}
.tc.done .tc-chk{background:var(--muted);border-color:var(--muted);}
.tc-body-h{flex:1;}
.tc-title{font-size:13.5px;font-weight:500;}
.tc-hint{font-size:12px;color:var(--muted);margin-top:2px;}
.tc-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.spill{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500;}
.sp-cn{background:var(--cn-bg);color:var(--cn);}
.sp-en{background:var(--en-bg);color:var(--en);}
.sp-ma{background:var(--ma-bg);color:var(--ma);}
.sp-po{background:var(--po-bg);color:var(--po);}
.sp-hi{background:var(--hi-bg);color:var(--hi);}
.sp-ge{background:var(--ge-bg);color:var(--ge);}
.arr{font-size:11px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
.tc.open .arr{transform:rotate(90deg);}
.tc-content{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.tc.open .tc-content{max-height:3000px;}
.tc-inner{padding:0 18px 18px;border-top:1px dashed var(--border);padding-top:16px;}

/* INSIDE CONTENT */
.poem{font-family:'PingFang SC','Microsoft YaHei','STSong',serif;font-size:15px;line-height:2.6;font-weight:500;}
.pline{display:block;}
.pnote{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--border);line-height:1.8;}
.block{background:var(--subtle);border-radius:9px;padding:13px 16px;margin-bottom:11px;
  font-size:13.5px;line-height:2;}
.block-t{font-weight:600;font-size:13px;margin-bottom:9px;}
.qi{border-left:3px solid var(--cn);padding:10px 14px;border-radius:0 7px 7px 0;
  margin-bottom:9px;background:var(--cn-bg);}
.qzh{font-family:'PingFang SC','Microsoft YaHei','STSong',serif;font-size:14.5px;font-weight:600;}
.qsrc{font-size:11.5px;color:var(--muted);margin-top:2px;}
.quse{font-size:12px;margin-top:5px;padding:3px 8px;background:rgba(0,0,0,.04);border-radius:4px;}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:8px;margin-bottom:10px;}
.vc{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--paper);}
.vw{font-size:15px;font-weight:700;color:var(--en);}
.vp{font-size:11px;color:var(--muted);font-family:monospace;margin:2px 0;}
.vz{font-size:12.5px;}
.ve{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:4px;line-height:1.5;}
.sent{border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px;background:var(--paper);}
.sen{font-size:13.5px;font-weight:500;line-height:1.8;margin-bottom:4px;}
.szh{font-size:12px;color:var(--muted);}
.stag{font-size:10px;padding:2px 7px;border-radius:3px;display:inline-block;margin-top:5px;background:#d1fae5;color:#065f46;}
.formula{font-family:'SF Mono','Courier New',monospace;background:var(--subtle);border-radius:8px;
  padding:13px 16px;font-size:12.5px;line-height:2.2;border-left:4px solid var(--ma);
  margin-bottom:10px;white-space:pre-wrap;}
.tbl{background:var(--subtle);border-radius:8px;padding:13px 16px;margin-bottom:9px;
  border-left:3px solid;font-size:13.5px;line-height:2.1;}
.tbt{font-weight:600;font-size:12.5px;margin-bottom:8px;}
.tl-wrap{padding-left:14px;position:relative;margin-bottom:10px;}
.tl-wrap::before{content:'';position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--border);}
.tli{position:relative;padding:3px 0 11px 16px;}
.tli::before{content:'';position:absolute;left:-10px;top:7px;width:7px;height:7px;
  border-radius:50%;background:var(--hi);}
.tly{font-family:'SF Mono','Courier New',monospace;font-size:11px;font-weight:600;color:var(--hi);}
.tle{font-size:12.5px;margin-top:1px;line-height:1.6;}
.acc{border:1px solid var(--border);border-radius:8px;margin-bottom:7px;background:var(--paper);}
.acc-h{padding:10px 14px;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;font-size:13px;font-weight:500;}
.acc-h:hover{background:var(--subtle);border-radius:8px;}
.acc-arr{color:var(--muted);font-size:11px;transition:transform .2s;}
.acc.open .acc-arr{transform:rotate(90deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;
  font-size:13px;line-height:2;color:var(--muted);padding:0 14px;}
.acc.open .acc-body{max-height:500px;padding:0 14px 12px;color:var(--ink);}
.tip{font-size:12px;color:var(--muted);background:rgba(0,0,0,.03);border-radius:6px;
  padding:8px 11px;margin-top:6px;line-height:1.7;}
.ask-row{display:flex;gap:8px;margin-top:10px;}
.ask-inp{flex:1;background:var(--paper);border:1px solid var(--border);border-radius:7px;
  padding:8px 12px;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;font-size:13px;outline:none;}
.ask-inp:focus{border-color:#aaa;}
.ask-btn{padding:8px 16px;border-radius:7px;border:none;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;color:#fff;white-space:nowrap;transition:opacity .15s;}
.ask-btn:hover{opacity:.82;}
.ask-ans{margin-top:10px;background:var(--subtle);border:1px solid var(--border);border-radius:8px;
  padding:13px 15px;font-size:13.5px;line-height:2;display:none;white-space:pre-wrap;}
.ask-ans.on{display:block;}

/* WEEKLY */
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
.wcard{background:var(--paper);border:1.5px solid var(--border);border-radius:10px;
  padding:14px;transition:all .15s;}
.wcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.wi{font-size:20px;margin-bottom:5px;}
.wn{font-size:13px;font-weight:600;margin-bottom:2px;}
.wd{font-size:11.5px;color:var(--muted);}
.wb{margin-top:8px;font-size:10px;padding:2px 7px;border-radius:3px;display:inline-block;
  font-family:'SF Mono','Courier New',monospace;background:#fef3c7;color:#92400e;}

/* SYNC */
.sync-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-top:8px;}
.sync-card h3{font-size:15px;font-weight:600;margin-bottom:4px;}
.sync-card p{font-size:13px;color:var(--muted);margin-bottom:12px;}
.sync-ta{width:100%;background:var(--subtle);border:1px solid var(--border);border-radius:8px;
  padding:11px 13px;color:var(--ink);font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  font-size:13px;line-height:1.8;resize:vertical;min-height:78px;outline:none;}
.sync-ta:focus{border-color:#aaa;}
.sync-btn{margin-top:10px;padding:9px 22px;background:var(--ink);color:var(--paper);border:none;
  border-radius:7px;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:opacity .15s;}
.sync-btn:hover{opacity:.82;}
.sync-btn:disabled{opacity:.4;cursor:not-allowed;}
.sync-res{margin-top:12px;background:var(--subtle);border:1px solid var(--border);border-radius:9px;
  padding:14px 16px;font-size:13.5px;line-height:2;display:none;white-space:pre-wrap;}
.sync-res.on{display:block;}
.sync-lbl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  font-family:'SF Mono','Courier New',monospace;margin-bottom:8px;}

.dots{display:inline-flex;gap:4px;align-items:center;}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s;}
.dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:1;}}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="logo">
    <div class="logo-title">高考复习</div>
    <div class="logo-sub">一轮 · 六科系统</div>
  </div>
  <div class="sb-top">
    <button class="today-btn" onclick="goToday()">
      <span class="live-dot"></span>今天的任务
    </button>
  </div>
  <div class="hist-label">历史记录</div>
  <div class="hist-scroll" id="histList"></div>
  <div class="sb-bottom">
    <div class="streak-box">
      <div class="streak-n" id="streakN">1</div>
      <div class="streak-l">连续学习天数 🔥</div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-title-row">
        <span class="tb-title" id="tbTitle">今日任务</span>
        <span class="tb-tag tag-today" id="tbTag">今天</span>
      </div>
      <div class="tb-date" id="tbDate"></div>
    </div>
    <div class="tb-right">
      <div class="countdown">下次更新 <span class="ctime" id="ctime">--:--:--</span></div>
      <div class="prog-row">
        <span id="progTxt">0/10</span>
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        完成
      </div>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
</div>
</div>

<script>
const UPDATE_HOUR = 6;
const DAYS_CN = ['周日','周一','周二','周三','周四','周五','周六'];
const SUBJ_NAME = {cn:'语文',en:'英语',ma:'数学',po:'政治',hi:'历史',ge:'地理'};

// ---- DATA BANK ----
const POEMS = [
  ['《静女》· 诗经·邶风','静女其姝，俟我于城隅。\n爱而不见，搔首踟蹰。\n静女其娈，贻我彤管。\n彤管有炜，说怿女美。\n自牧归荑，洵美且异。\n匪女之为美，美人之贻。','比兴手法；"匪女之为美，美人之贻"借物抒情；描写等待情态，语言质朴'],
  ['《涉江采芙蓉》· 古诗十九首','涉江采芙蓉，兰泽多芳草。\n采之欲遗谁？所思在远道。\n还顾望旧乡，长路漫浩浩。\n同心而离居，忧伤以终老。','以乐景衬哀情；"还顾"转折有力；游子思乡与夫妻离别之情'],
  ['《短歌行》· 曹操（节选）','对酒当歌，人生几何！譬如朝露，去日苦多。\n何以解忧？唯有杜康。\n青青子衿，悠悠我心。但为君故，沉吟至今。\n月明星稀，乌鹊南飞。绕树三匝，何枝可依？\n山不厌高，海不厌深。周公吐哺，天下归心。','引《诗经》求贤；"周公吐哺"用典；默写热点："何以解忧""周公吐哺"'],
  ['《归园田居·其一》· 陶渊明','少无适俗韵，性本爱丘山。\n误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。\n榆柳荫后檐，桃李罗堂前。','对仗；"羁鸟恋旧林"比喻；归隐田园的愉悦与对官场的厌弃'],
  ['《登高》· 杜甫','风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。','情景交融；叠词"萧萧""滚滚"；沉郁悲凉，高考必考篇目'],
  ['《念奴娇·赤壁怀古》· 苏轼','大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。','豪放派代表；以古衬今；借周瑜抒发壮志未酬之感'],
];

const QUOTE_SETS = [
  [
    {z:'先天下之忧而忧，后天下之乐而乐。',s:'范仲淹《岳阳楼记》',u:'家国担当·责任感·以民为本'},
    {z:'长风破浪会有时，直挂云帆济沧海。',s:'李白《行路难》',u:'逆境奋进·理想·结尾升华'},

// ---- DATE HELPERS ----
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function keyToDate(k) {
  const [y,m,d] = k.split('-');
  return new Date(+y, +m-1, +d);
}
function keyLabel(k) {
  const d = keyToDate(k);
  return `${d.getMonth()+1}月${d.getDate()}日 · ${DAYS_CN[d.getDay()]}`;
}
function isToday(k) { return k === todayKey(); }

// ---- STORAGE ----
function loadStore() { return JSON.parse(localStorage.getItem('gk4') || '{}'); }
function saveStore(s) { localStorage.setItem('gk4', JSON.stringify(s)); }
function getDayData(k) {
  const s = loadStore();
  if (!s[k]) { s[k] = { tasks: buildTasks(k), done: [], sync: '' }; saveStore(s); }
  return s[k];
}
function setDone(k, id, v) {
  const s = loadStore();
  if (!s[k]) return;
  if (v && !s[k].done.includes(id)) s[k].done.push(id);
  if (!v) s[k].done = s[k].done.filter(x => x !== id);
  saveStore(s);
}
function setSync(k, txt) {
  const s = loadStore(); if (!s[k]) return;
  s[k].sync = txt; saveStore(s);
}

    const [title, lines, note] = POEMS[i % POEMS.length];
    const lineHtml = lines.split('\n').map(l => `<span class="pline">${l}</span>`).join('');
    return `<div class="block" style="border-left:3px solid var(--cn)">
      <div class="block-t">📜 ${title}</div>
      <div class="poem">${lineHtml}</div>
      <div class="pnote">📌 考点：${note}</div>
    </div>
    <div class="tip">✅ 背诵方法：读3遍 → 遮住默写 → 对照检查 → 标记错的句子重点攻克</div>`;
  }

    const qs = QUOTE_SETS[i % QUOTE_SETS.length];

      <div class="qzh">${q.z}</div>
      <div class="qsrc">——${q.s}</div>
      <div class="quse">✏️ ${q.u}</div>

// ---- RENDER DAY ----
let curKey = todayKey();

function renderDay(k) {
  curKey = k;
  const data = getDayData(k);
  const tasks = data.tasks;
  const done = data.done;
  const tot = tasks.length;
  const comp = done.length;
  const pct = Math.round(comp / tot * 100);
  const isTod = isToday(k);
  const dt = keyToDate(k);

  document.getElementById('tbTitle').textContent = isTod ? '今日任务' : `${dt.getMonth()+1}月${dt.getDate()}日的任务`;
  const tag = document.getElementById('tbTag');
  tag.textContent = isTod ? '今天' : '历史记录';
  tag.className = 'tb-tag ' + (isTod ? 'tag-today' : 'tag-hist');
  document.getElementById('tbDate').textContent = `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日 · ${DAYS_CN[dt.getDay()]}`;
  document.getElementById('progTxt').textContent = `${comp}/${tot}`;
  document.getElementById('progFill').style.width = pct + '%';

  let html = `<div class="day-hdr">
    <div class="dh-left">
      <div class="dh-title">${dt.getMonth()+1}月${dt.getDate()}日 · ${DAYS_CN[dt.getDay()]}</div>
      <div class="dh-sub">${isTod ? '📌 今天的任务清单' : '📁 历史任务记录'}</div>
    </div>
    <div class="dh-stat">
      <div class="dh-num">${comp}<span style="font-size:14px;color:var(--muted)">/${tot}</span></div>
      <div class="dh-nlabel">任务完成</div>
      <div class="dh-track"><div class="dh-fill" style="width:${pct}%"></div></div>
    </div>
  </div>`;

  if (!isTod) {
    html += `<div class="hist-notice">📁 这是 ${dt.getMonth()+1}月${dt.getDate()}日 的历史任务，打勾记录依然有效。</div>`;
  }

  html += `<div class="sec-label">每日必做任务 · 点击展开学习内容</div>`;

  tasks.forEach(task => {
    const isDone = done.includes(task.id);
    html += `<div class="tc${isDone?' done':''}" data-s="${task.s}" id="tc-${k}-${task.id}">
      <div class="tc-head" onclick="toggleCard('${k}',${task.id})">
        <div class="tc-chk" onclick="checkTask(event,'${k}',${task.id})">${isDone?'✓':''}</div>
        <div class="tc-body-h">
          <div class="tc-title">${task.title}</div>
          <div class="tc-hint">${task.hint}</div>
        </div>
        <div class="tc-meta">
          <span class="spill sp-${task.s}">${SUBJ_NAME[task.s]}</span>
          <span class="arr">▶</span>
        </div>
      </div>
      <div class="tc-content">
        <div class="tc-inner">${renderContent(task)}</div>
      </div>
    </div>`;
  });

  html += `<div style="margin-top:24px"><div class="sec-label">本周周期任务</div>
  <div class="wgrid">
    <div class="wcard"><div class="wi">✍️</div><div class="wn" style="color:var(--en)">英语</div><div class="wd">限时作文训练</div><span class="wb">本周待做</span></div>
    <div class="wcard"><div class="wi">📋</div><div class="wn" style="color:var(--po)">政治</div><div class="wd">限时小考</div><span class="wb">本周待做</span></div>
    <div class="wcard"><div class="wi">📝</div><div class="wn" style="color:var(--hi)">历史</div><div class="wd">限时小论文</div><span class="wb">本周待做</span></div>
    <div class="wcard"><div class="wi">🗺️</div><div class="wn" style="color:var(--ge)">地理</div><div class="wd">模板整合</div><span class="wb">本周待做</span></div>
  </div></div>`;

  if (isTod) {
    const savedSync = loadStore()[k]?.sync || '';
    html += `<div class="sync-card">
      <h3>📝 今日学习同步</h3>
      <p>说说今天完成了什么、哪里卡住了——AI帮你分析并调整明天计划。</p>
      <textarea class="sync-ta" id="syncTA" placeholder="例如：语文古诗背了3首感觉还行，英语单词有点记不住……政治经济部分有点乱……">${savedSync}</textarea><br>
      <button class="sync-btn" id="syncBtn" onclick="doSync()">同步并获取AI反馈 →</button>
      <div class="sync-res" id="syncRes"><div class="sync-lbl">AI 学习顾问反馈</div><div id="syncTxt"></div></div>
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
  renderSidebar();
}

// ---- SIDEBAR ----
function renderSidebar() {
  const s = loadStore();
  const today = todayKey();
  getDayData(today); // ensure today exists

  const keys = [];
  for (let i = 0; i <= 60; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (s[k] || i === 0) keys.push(k);
  }

  const html = keys.map(k => {
    const d = keyToDate(k);
    const isTod = isToday(k);
    const data = s[k];
    const done = data?.done?.length || 0;
    const tot = data?.tasks?.length || 10;
    const pct = done / tot;
    const dotCls = isTod ? 'hdot-today' : pct === 1 ? 'hdot-full' : pct > 0 ? 'hdot-part' : 'hdot-none';
    return `<div class="hist-item${k===curKey?' cur':''}" onclick="renderDay('${k}')">
      <div class="hdot ${dotCls}"></div>
      <div>
        <div class="hist-date">${d.getMonth()+1}/${d.getDate()}${isTod?' · 今天':''}</div>
        <div class="hist-day">${DAYS_CN[d.getDay()]}</div>
      </div>
      <div class="hist-prog">${done}/${tot}</div>
    </div>`;
  }).join('');
  document.getElementById('histList').innerHTML = html;

  // streak
  const streak = keys.filter(k => {
    const d = s[k]; return d && d.done && d.done.length > 0;
  }).length;
  document.getElementById('streakN').textContent = streak || 1;
}

// ---- INTERACTIONS ----
function goToday() { renderDay(todayKey()); }

function toggleCard(k, id) {
  const el = document.getElementById(`tc-${k}-${id}`);
  if (el) el.classList.toggle('open');
}

function checkTask(e, k, id) {
  e.stopPropagation();
  const s = loadStore();
  const data = s[k];
  if (!data) return;
  const isDone = data.done.includes(id);
  setDone(k, id, !isDone);
  // update just this card visually without full re-render
  const card = document.getElementById(`tc-${k}-${id}`);
  if (card) {
    if (!isDone) card.classList.add('done'); else card.classList.remove('done');
    const chk = card.querySelector('.tc-chk');
    if (chk) chk.textContent = !isDone ? '✓' : '';
  }
  // update progress
  const newData = loadStore()[k];
  const comp = newData.done.length, tot = newData.tasks.length;
  document.getElementById('progTxt').textContent = `${comp}/${tot}`;
  document.getElementById('progFill').style.width = Math.round(comp/tot*100) + '%';
  const dhNum = document.querySelector('.dh-num');
  if (dhNum) dhNum.innerHTML = `${comp}<span style="font-size:14px;color:var(--muted)">/${tot}</span>`;
  const dhFill = document.querySelector('.dh-fill');
  if (dhFill) dhFill.style.width = Math.round(comp/tot*100) + '%';
  renderSidebar();
}

function toggleAcc(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ---- COUNTDOWN ----
function updateCountdown() {
  const now = new Date();
  const next = new Date();
  next.setHours(UPDATE_HOUR, 0, 0, 0);
  if (now >= next) next.setDate(next.getDate() + 1);
  const diff = next - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const sv = Math.floor((diff % 60000) / 1000);
  document.getElementById('ctime').textContent =
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sv).padStart(2,'0')}`;
}

async function callAI(sys,q){
  const r=await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer 649b4ea7fec34a969cc58bdc6adc5997.urCmf0fjdn4GiGBo'},
    body:JSON.stringify({model:'glm-4-flash',max_tokens:1000,messages:[{role:'system',content:sys},{role:'user',content:q}]})
  });
  const d=await r.json();
  return d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||'请求失败，请重试。';
}

function showLoading(boxId) {
  const box = document.getElementById(boxId);
  if (box) { box.classList.add('on'); box.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> 正在思考…'; }
  return box;
}

async function taskAsk(s, inputId, ansId) {
  const inp = document.getElementById(inputId);
  const box = showLoading(ansId);
  if (!inp || !box) return;
  const q = inp.value.trim(); if (!q) { box.classList.remove('on'); return; }
  try { box.textContent = await callAI(AI_SYS[s], q); }
  catch { box.textContent = '网络失败，请重试。'; }
}

async function doSync() {
  const ta = document.getElementById('syncTA');
  const btn = document.getElementById('syncBtn');
  const res = document.getElementById('syncRes');
  const txt = document.getElementById('syncTxt');
  if (!ta || !btn) return;
  const q = ta.value.trim(); if (!q) return;
  btn.disabled = true; btn.textContent = '分析中…';
  res.classList.add('on');
  txt.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> AI分析中…';
  const sys = `你是高考备考学习顾问，管理高三学生六科一轮复习：语文（古诗/名句/答题）英语（词汇/句子/语法）数学（章节复习）政治（必修背记）历史（小论文/专题）地理（模板背记）。根据学生今日情况给：①整体简评（鼓励为主，2-3句）②各科薄弱点建议（具体可操作，每科最多2条）③明天重点调整建议（1-2条）。语气像学长，简洁口语化，不要太正式。`;
  try {
    const ans = await callAI(sys, '今日学习情况：' + q);
    txt.textContent = ans;
    setSync(todayKey(), q);
  } catch { txt.textContent = '网络失败，请重试。'; }
  btn.disabled = false; btn.textContent = '同步并获取AI反馈 →';
}

// ---- AUTO REFRESH ----
function checkRefresh() {
  const now = new Date();
  if (now.getHours() === UPDATE_HOUR && now.getMinutes() === 0 && now.getSeconds() < 10) {
    getDayData(todayKey());
    if (isToday(curKey)) renderDay(todayKey());
    renderSidebar();
  }
}

// ---- INIT ----
getDayData(todayKey());
renderDay(todayKey());
updateCountdown();
setInterval(updateCountdown, 1000);
setInterval(checkRefresh, 5000);
